apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: conversation-service }
  template:
    metadata: { labels: { app: conversation-service } }
    spec:
      containers:
        - name: conversation
          image: ciudadano-ai/conversation-service:latest
          ports: [{ containerPort: 3001 }]
          envFrom: [{ configMapRef: { name: ciudadano-config } }, { secretRef: { name: ciudadano-secrets } }]
          readinessProbe: { httpGet: { path: /ready, port: 3001 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: conversation-service
spec:
  selector: { app: conversation-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
spec:
  replicas: 2
  selector: { matchLabels: { app: nlp-service } }
  template:
    metadata: { labels: { app: nlp-service } }
    spec:
      containers:
        - name: nlp
          image: ciudadano-ai/nlp-service:latest
          ports: [{ containerPort: 8001 }]
          readinessProbe: { httpGet: { path: /ready, port: 8001 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1, memory: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: nlp-service }
spec: { selector: { app: nlp-service }, ports: [{ port: 8001, targetPort: 8001 }] }
