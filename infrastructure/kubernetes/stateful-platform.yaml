apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env: [{ name: POSTGRES_DB, value: ciudadano_ai }, { name: POSTGRES_USER, value: ciudadano }, { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ciudadano-secrets, key: POSTGRES_PASSWORD } } }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: [pg_isready, -U, ciudadano] } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.8
          ports: [{ containerPort: 9092 }]
          env: [{ name: KAFKA_CFG_NODE_ID, value: "1" }, { name: KAFKA_CFG_PROCESS_ROLES, value: broker,controller }, { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }, { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }, { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }, { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }, { name: ALLOW_PLAINTEXT_LISTENER, value: "yes" }]
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec: { selector: { app: kafka }, ports: [{ port: 9092, targetPort: 9092 }] }
