apiVersion: v1
kind: Secret
metadata:
  name: ciudadano-secrets
type: Opaque
stringData:
  JWT_SECRET: generate-at-least-32-random-characters
  POSTGRES_PASSWORD: generate-a-password
  DATA_ENCRYPTION_KEY: generate-64-hex-characters
  INTERNAL_API_KEY: generate-an-internal-key
  AUDIT_SIGNING_KEY: generate-a-signing-key
  DEFAULT_ADMIN_PASSWORD: generate-a-password
  IDENTITY_HASH_KEY: generate-at-least-32-independent-random-characters
