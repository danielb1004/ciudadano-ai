apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services
  namespace: ciudadano-ai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-gateway
  namespace: ciudadano-ai
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - kong
      - frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: caddy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: ciudadano-ai
data:
  kong.yml: "_format_version: '3.0'\nservices:\n- name: conversation\n  url: http://conversation-service:3001\n\
    \  routes:\n  - name: conversation-route\n    paths:\n    - /api/v1/conversations\n\
    \    strip_path: false\n- name: nlp\n  url: http://nlp-service:8001\n  routes:\n\
    \  - name: nlp-route\n    paths:\n    - /api/v1/models\n    strip_path: false\n\
    - name: catalog\n  url: http://catalog-service:3002\n  routes:\n  - name: catalog-route\n\
    \    paths:\n    - /api/v1/procedures\n    - /api/v1/entities\n    - /api/v1/categories\n\
    \    - /api/v1/requests\n    strip_path: false\n- name: recommendation\n  url:\
    \ http://recommendation-service:3003\n  routes:\n  - name: recommendation-route\n\
    \    paths:\n    - /api/v1/recommendations\n    strip_path: false\n- name: auth\n\
    \  url: http://auth-service:3004\n  routes:\n  - name: auth-route\n    paths:\n\
    \    - /api/v1/auth\n    - /api/v1/profiles\n    strip_path: false\n- name: audit\n\
    \  url: http://audit-service:3005\n  routes:\n  - name: audit-route\n    paths:\n\
    \    - /api/v1/audit\n    strip_path: false\nplugins:\n- name: correlation-id\n\
    - name: rate-limiting\n  config:\n    minute: 60\n    policy: redis\n    redis_host:\
    \ redis\n    redis_port: 6379\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
  namespace: ciudadano-ai
data:
  init.sql: 'CREATE SCHEMA IF NOT EXISTS conversation;

    CREATE SCHEMA IF NOT EXISTS profiles;

    CREATE SCHEMA IF NOT EXISTS recommendations;

    CREATE SCHEMA IF NOT EXISTS auth;

    CREATE SCHEMA IF NOT EXISTS audit;

    CREATE TABLE IF NOT EXISTS audit.events (event_id UUID PRIMARY KEY, event_type
    TEXT NOT NULL, event_version TEXT NOT NULL, occurred_at TIMESTAMPTZ NOT NULL,
    correlation_id UUID NOT NULL, conversation_id UUID, producer TEXT NOT NULL, payload
    JSONB NOT NULL, hash TEXT NOT NULL, previous_hash TEXT);

    CREATE INDEX IF NOT EXISTS audit_events_conversation_idx ON audit.events(conversation_id);

    CREATE INDEX IF NOT EXISTS audit_events_type_idx ON audit.events(event_type);

    CREATE TABLE IF NOT EXISTS recommendations.procedures (id UUID PRIMARY KEY, title
    TEXT NOT NULL, body TEXT NOT NULL, search_vector TSVECTOR GENERATED ALWAYS AS
    (to_tsvector(''spanish'', title || '' '' || body)) STORED, source_urls JSONB NOT
    NULL, verified_at DATE, published BOOLEAN NOT NULL DEFAULT FALSE);

    CREATE INDEX IF NOT EXISTS procedures_search_idx ON recommendations.procedures
    USING GIN(search_vector);

    CREATE TABLE IF NOT EXISTS profiles.citizen_profiles (id UUID PRIMARY KEY, anonymous
    BOOLEAN NOT NULL DEFAULT TRUE, preferences JSONB NOT NULL DEFAULT ''{}'', tech_experience
    TEXT, created_at TIMESTAMPTZ NOT NULL DEFAULT now(), deleted_at TIMESTAMPTZ);

    CREATE TABLE IF NOT EXISTS profiles.consents (id UUID PRIMARY KEY, profile_id
    UUID NOT NULL, purpose TEXT NOT NULL, version TEXT NOT NULL, granted BOOLEAN NOT
    NULL, created_at TIMESTAMPTZ NOT NULL, revoked_at TIMESTAMPTZ);

    CREATE TABLE IF NOT EXISTS conversation.sessions (id UUID PRIMARY KEY, anonymous_user_id
    UUID, state JSONB NOT NULL, expires_at TIMESTAMPTZ NOT NULL);

    CREATE TABLE IF NOT EXISTS auth.admins (id UUID PRIMARY KEY, email TEXT UNIQUE
    NOT NULL, password_hash TEXT NOT NULL, roles JSONB NOT NULL, permissions JSONB
    NOT NULL, revoked BOOLEAN NOT NULL DEFAULT FALSE);


    CREATE SCHEMA IF NOT EXISTS catalog;

    CREATE TABLE IF NOT EXISTS conversation.app_state (namespace TEXT NOT NULL, key
    TEXT NOT NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS conversation_state_expiry_idx ON conversation.app_state(expires_at);

    CREATE TABLE IF NOT EXISTS profiles.app_state (namespace TEXT NOT NULL, key TEXT
    NOT NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS profiles_state_expiry_idx ON profiles.app_state(expires_at);

    CREATE TABLE IF NOT EXISTS catalog.app_state (namespace TEXT NOT NULL, key TEXT
    NOT NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS catalog_state_expiry_idx ON catalog.app_state(expires_at);

    CREATE TABLE IF NOT EXISTS recommendations.app_state (namespace TEXT NOT NULL,
    key TEXT NOT NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY
    KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS recommendations_state_expiry_idx ON recommendations.app_state(expires_at);

    CREATE TABLE IF NOT EXISTS auth.app_state (namespace TEXT NOT NULL, key TEXT NOT
    NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS auth_state_expiry_idx ON auth.app_state(expires_at);

    CREATE TABLE IF NOT EXISTS audit.app_state (namespace TEXT NOT NULL, key TEXT
    NOT NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS audit_state_expiry_idx ON audit.app_state(expires_at);


    CREATE SCHEMA IF NOT EXISTS recommendation;

    CREATE TABLE IF NOT EXISTS recommendation.app_state (namespace TEXT NOT NULL,
    key TEXT NOT NULL, data TEXT NOT NULL, expires_at TIMESTAMPTZ NOT NULL, PRIMARY
    KEY(namespace,key));

    CREATE INDEX IF NOT EXISTS recommendation_state_expiry_idx ON recommendation.app_state(expires_at);

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: ciudadano-ai
data:
  default.conf: "server {\n  listen 80;\n  root /usr/share/nginx/html;\n  set_real_ip_from\
    \ 10.42.0.0/16;\n  real_ip_header X-Forwarded-For;\n  real_ip_recursive on;\n\
    \  index index.html;\n  include /etc/nginx/conf.d/security-headers.inc;\n  location\
    \ /api/ {\n    proxy_pass http://kong:8000;\n    proxy_set_header Host $host;\n\
    \    proxy_set_header X-Forwarded-For $remote_addr;\n    proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n  }\n  location / { try_files $uri /index.html; }\n}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: ciudadano-ai
data:
  Caddyfile: "ciudadano-ai.3-142-230-27.sslip.io {\n tls {\n protocols tls1.3\n }\n\
    \ header {\n Strict-Transport-Security \"max-age=31536000\"\n -Server\n }\n reverse_proxy\
    \ frontend:80 {\n header_up X-Forwarded-For {remote_host}\n }\n}\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: ciudadano-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: ciudadano-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: ciudadano-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
      - name: caddy
        image: caddy:2-alpine
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/caddy
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: caddy-config
      - name: data
        persistentVolumeClaim:
          claimName: caddy-data
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: ciudadano-ai
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: caddy
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-caddy
  namespace: ciudadano-ai
spec:
  podSelector:
    matchLabels:
      app: caddy
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
