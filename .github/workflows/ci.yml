name: Ciudadano AI verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend, shared, services/auth-service, services/catalog-service, services/conversation-service, services/recommendation-service, services/audit-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build --workspace ${{ matrix.workspace }}
  node-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: research/evidence/coverage }
  nlp-service:
    runs-on: ubuntu-latest
    env: { NLP_BACKEND: rules }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r testing/requirements.txt
      - run: python -m pytest services/nlp-service/tests ml/testing -q
      - run: python -m pip_audit
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r services/nlp-service/requirements.txt
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev > /tmp/ciudadano-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3004/health && curl -fsS http://localhost:8001/ready && curl -fsS http://localhost:5173; then break; fi
            sleep 1
          done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-evidence, path: research/evidence/browser-* }
