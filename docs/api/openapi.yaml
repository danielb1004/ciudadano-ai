        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Procedure'
    delete:
      summary: Desactivar y preservar versiones; catalog_write
      responses:
        '204':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
