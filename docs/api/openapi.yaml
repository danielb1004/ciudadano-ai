        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
  /api/v1/profiles/{id}/data:
