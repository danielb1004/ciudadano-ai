          type: string
  /api/v1/conversations/{conversationId}/messages:
    post:
      summary: Procesar mensaje; 410 si sesion expirada
      responses:
        '200':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
              - message
  /api/v1/conversations/{conversationId}/feedback:
    post:
      summary: Reportar respuesta existente
      responses:
        '202':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: string
                  format: uuid
                rating:
                  type: string
                  enum:
                  - positive
                  - negative
                  - helpful
                  - unhelpful
                comment:
                  type: string
                  maxLength: 500
              required:
              - messageId
              - rating
  /api/v1/conversations/metrics/summary:
