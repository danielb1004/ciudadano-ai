openapi: 3.0.3
info:
  title: Ciudadano AI
  version: 2.0.0
  description: 'Prototipo academico. Profile: datos propios. Citizen: seguimiento
    OTP. Admin: permisos. Las rutas /internal no se publican.'
servers:
- url: http://localhost:8000
paths:
  /api/v1/profiles:
    post:
      summary: Perfil sin consentimiento
      responses:
        '201':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferences: &id001
                  type: object
                  properties:
                    fontScale:
                      type: number
                      minimum: 0.8
                      maximum: 2
                    highContrast:
                      type: boolean
                    speechEnabled:
                      type: boolean
                    concise:
                      type: boolean
                  required: []
              required: []
  /api/v1/profiles/{id}:
    get:
      summary: Consultar o eliminar datos propios
      responses:
        '200':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    delete:
      summary: Consultar o eliminar datos propios
      responses:
        '200':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      summary: Actualizar preferencias propias
      responses:
        '200':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferences: *id001
              required: []
  /api/v1/profiles/{id}/consents:
    get:
      summary: Decisiones y versiones de consentimiento
      responses:
        '200':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      summary: Otorgar o revocar consentimiento
      responses:
        '201':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum:
                  - conversation_context
                  - usability_research
                  - analytics
                version:
                  type: string
                  enum:
                  - '1.0'
                granted:
                  type: boolean
              required:
              - purpose
              - version
              - granted
  /api/v1/profiles/{id}/consents/{consentId}:
    delete:
      summary: Revocar y purgar contexto
      responses:
        '204':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: consentId
        required: true
        schema:
          type: string
  /api/v1/profiles/{id}/export:
