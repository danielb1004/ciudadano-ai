        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
  /api/v1/conversations/{conversationId}:
    get:
      summary: Consultar o eliminar sesion propia
      responses:
        '200':
          description: Operacion completada
        '400':
          description: Entrada invalida
        '401':
          description: Token ausente o invalido
        '403':
          description: Permiso, titularidad o consentimiento insuficiente
        '429':
          description: Limite de tasa o intentos
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      parameters:
