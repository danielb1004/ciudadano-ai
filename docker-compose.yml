services:
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [kong]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ciudadano, POSTGRES_PASSWORD: change-me-in-secret-store, POSTGRES_DB: ciudadano_ai }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ciudadano"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
  kafka:
    image: bitnami/kafka:3.8
    environment: { KAFKA_CFG_NODE_ID: 1, KAFKA_CFG_PROCESS_ROLES: "broker,controller", KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093", KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093", KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092", KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER, ALLOW_PLAINTEXT_LISTENER: "yes" }
    ports: ["9092:9092"]
  kong:
    image: kong:3.8
    environment: { KONG_DATABASE: "off", KONG_DECLARATIVE_CONFIG: /kong/kong.yml, KONG_PROXY_LISTEN: "0.0.0.0:8000", KONG_ADMIN_LISTEN: "0.0.0.0:8001" }
    volumes: ["./infrastructure/kong/kong.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000"]
  nlp:
    build: ./services/nlp-service
  conversation:
    build: { context: ., dockerfile: infrastructure/docker/node-service.Dockerfile, args: { SERVICE_NAME: conversation-service } }
    environment: { SERVICE_NAME: conversation-service, PORT: 3001, NLP_URL: "http://nlp:8001", PROFILE_URL: "http://profile:3002", RECOMMENDATION_URL: "http://recommendation:3003", REDIS_URL: "redis://redis:6379", KAFKA_BROKERS: "kafka:9092", POSTGRES_HOST: postgres, POSTGRES_USER: ciudadano, POSTGRES_PASSWORD: change-me-in-secret-store, POSTGRES_DB: ciudadano_ai }
  profile:
    build: { context: ., dockerfile: infrastructure/docker/node-service.Dockerfile, args: { SERVICE_NAME: profile-service } }
    environment: { SERVICE_NAME: profile-service, PORT: 3002, KAFKA_BROKERS: "kafka:9092", POSTGRES_HOST: postgres, POSTGRES_USER: ciudadano, POSTGRES_PASSWORD: change-me-in-secret-store, POSTGRES_DB: ciudadano_ai }
  recommendation:
    build: { context: ., dockerfile: infrastructure/docker/node-service.Dockerfile, args: { SERVICE_NAME: recommendation-service } }
    environment: { SERVICE_NAME: recommendation-service, PORT: 3003, KAFKA_BROKERS: "kafka:9092", POSTGRES_HOST: postgres, POSTGRES_USER: ciudadano, POSTGRES_PASSWORD: change-me-in-secret-store, POSTGRES_DB: ciudadano_ai }
  auth:
    build: { context: ., dockerfile: infrastructure/docker/node-service.Dockerfile, args: { SERVICE_NAME: auth-service } }
    environment: { SERVICE_NAME: auth-service, PORT: 3004, JWT_SECRET: change-me-in-secret-store, KAFKA_BROKERS: "kafka:9092", POSTGRES_HOST: postgres, POSTGRES_USER: ciudadano, POSTGRES_PASSWORD: change-me-in-secret-store, POSTGRES_DB: ciudadano_ai }
  audit:
    build: { context: ., dockerfile: infrastructure/docker/node-service.Dockerfile, args: { SERVICE_NAME: audit-service } }
    environment: { SERVICE_NAME: audit-service, PORT: 3005, KAFKA_BROKERS: "kafka:9092", POSTGRES_HOST: postgres, POSTGRES_USER: ciudadano, POSTGRES_PASSWORD: change-me-in-secret-store, POSTGRES_DB: ciudadano_ai }
volumes: { pgdata: {} }
